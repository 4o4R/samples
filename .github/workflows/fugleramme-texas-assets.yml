name: Build Fugleramme Texas artwork assets

on:
  push:
    branches:
      - fugleramme-texas-assets-build-20260916
    paths:
      - 'fugleramme-texas-build/**'
      - '.github/workflows/fugleramme-texas-assets.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy requests rapidfuzz opencv-python-headless rembg onnxruntime

      - name: Clone Fugleramme upstream
        run: |
          rm -rf fugleramme-texas-build/fugleramme-upstream
          git clone --depth 1 https://github.com/arnegiacomo/fugleramme.git fugleramme-texas-build/fugleramme-upstream

      - name: Build Texas artwork package
        run: python fugleramme-texas-build/build.py

      - name: Show summary
        if: always()
        run: |
          if [ -f fugleramme-texas-build/output/reports/summary.json ]; then
            cat fugleramme-texas-build/output/reports/summary.json
          fi

      - name: Upload complete package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fugleramme-texas-assets
          path: fugleramme-texas-build/output/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
